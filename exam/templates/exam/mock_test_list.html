<!DOCTYPE html>
<html>
<head>
    <title>test</title>
</head>

<body>
{% for test in mock_tests %}

    <h3>{{ test.title }}</h3>

    <p>
        {{ test.subject.name }}
        -
        {{ test.duration_minutes }} minutes
        -
        {{ test.total_marks }} marks
    </p>

    <a href="{% url 'exam:mock_test_detail' test.id %}">
        View Test
    </a>

{% empty %}

    <p>No mock tests available.</p>

{% endfor %}
</body>
</html>
