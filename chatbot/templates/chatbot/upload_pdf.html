<!DOCTYPE html>
<html>

<head>

    <title>Upload PDF</title>

</head>

<body>

<h1>📄 Upload Study Material</h1>

<p>
    Upload your textbook, notes or study material.
</p>

{% if messages %}

    {% for message in messages %}

        <p>{{ message }}</p>

    {% endfor %}

{% endif %}

<form
    method="POST"
    enctype="multipart/form-data"
>

    {% csrf_token %}

    <input
        type="file"
        name="file"
        accept=".pdf"
        required
    >

    <br><br>

    <button type="submit">
        Upload PDF
    </button>

</form>

<br>

<a href="{% url 'dashboard' %}">
    ← Back to Dashboard
</a>

</body>

</html>
